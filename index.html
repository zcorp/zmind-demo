<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Transformez vos idées en cartes claires avec ZMIND." />
  <meta name="theme-color" content="#f7f8f5" />
  <link rel="icon" type="image/jpeg" href="%BASE_URL%brand/zmind-icon.jpg" />
  <link rel="apple-touch-icon" href="%BASE_URL%brand/zmind-icon.jpg" />
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="ZMIND" />
  <title>ZMIND — Cartes mentales</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      background: var(--background, #ffffff);
      color: var(--text, #000000);
    }

    #root {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    svg {
      cursor: grab;
    }

    svg:active {
      cursor: grabbing;
    }

    .node rect {
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .node rect:hover {
      opacity: 0.9;
      filter: brightness(1.1);
    }

    .connection path {
      transition: stroke 0.2s ease;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
